version: 2

sources:
  - name: adventure_works
    catalog: mesh_dev_db
    schema: adventure_works
    tables:
      - name: production_product
        description: Tabela de informações de produto
        columns:  
          - name: productid
            description: Chave primária da tabela de informações de produto
            data_tests:
              - unique
              - not_null
      - name: production_productcategory
        description: Tabela de informações de categoria de produto
        columns:  
          - name: productcategoryid
            description: Chave primária da tabela de categoria de produto
            data_tests:
              - unique
              - not_null
      - name: production_productsubcategory
        description: Tabela de informações de subcategoria de produto
        columns:  
          - name: productsubcategoryid
            description: Chave primária da tabela de subcategoria de produto
            data_tests:
              - unique
              - not_null